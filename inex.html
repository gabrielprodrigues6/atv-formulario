<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Inscrição para Curso de Programação</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome:</label>  
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required> <br>

            <label for="sobrenome">Sobrenome:</label> 
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required> <br>
            
            <label for="email">E-mail:</label> 
            <input type="email" id="email" name="email" placeholder="Digite seu email" required> <br>
            
            <label for="password">Senha:</label> 
            <input type="password" id="password" name="senha" placeholder="Digite sua senha" minlength="8" required> <br>
            
            <label for="tel">Telefone:</label> 
            <input type="tel" id="tel" name="telefone" placeholder="Digite seu telefone" required> <br>
            
            <label for="idade">Idade:</label> 
            <input type="number" id="idade" name="idade" placeholder="Digite sua idade" min="14" max="100" required> <br>
            
            <label for="date">Data:</label> 
            <input type="date" id="date" name="data" required>

        </fieldset>

        <fieldset>
            <legend>Informações do curso</legend>

            <label for="html">HTML e CSS</label>
            <input type="radio"  id="html" name="curso" value="html" required > <br>

            <label for="javaScript">JavaScript</label>
            <input type="radio"  id="javaScript" name="curso" value="javaScript"> <br>

            <label for="python">Python</label>
            <input type="radio" id="python" name="curso" value="python"> <br>

            <label for="java">Java</label>
            <input type="radio" id="java"  name="curso" value="java"> <br>

            <label for="banco">Banco de Dados</label>
            <input type="radio"  id="banco" name="curso" value="banco"> <br>

        </fieldset>

        <fieldset>
            <legend>Modalidade</legend>

            <label for="online">Online</label>
            <input type="radio"  id="online" name="modalidade" value="online" required>

            <label for="presencial">Presencial</label>
            <input type="radio"  id="presencial" name="modalidade" value="presencial">
        </fieldset>

        <fieldset>
            <legend>Turno</legend>

            <label for="manhã">Manhã</label>
            <input type="radio" id="manhã" name="turno" required>

             <label for="tarde">Tarde</label>
            <input type="radio" id="tarde" name="turno" required>

             <label for="noite">Noite</label>
            <input type="radio" id="noite" name="turno" required>
        </fieldset>

         <fieldset>
            <legend>Nível</legend>

            <label for="nivel">Escolha seu nível:</label>
            <select id="nivel" name="nivel" required>
                <option value="">Selecione seu nível</option>
                <option value="iniciante">Iniciante</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Tecnologias</legend>

            <p>Escolha as tecnologias que você conhece:</p>

            <input type="checkbox" id="tec-html" name="tecnologias" value="html">
            <label for="tec-html">HTML</label>

            <input type="checkbox" id="tec-css" name="tecnologias" value="css">
            <label for="tec-css">CSS</label>

            <input type="checkbox" id="tec-javascript" name="tecnologias" value="javascript">
            <label for="tec-javascript">JavaScript</label>

            <input type="checkbox" id="tec-python" name="tecnologias" value="python">
            <label for="tec-python">Python</label>

            <input type="checkbox" id="tec-java" name="tecnologias" value="java">
            <label for="tec-java">Java</label>

            <input type="checkbox" id="tec-csharp" name="tecnologias" value="csharp">
            <label for="tec-csharp">C#</label>

        </fieldset>

        <fieldset>
            <legend>Localização</legend>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione seu estado</option>
                <option value="sp">São Paulo</option>
                <option value="mg">Minas Gerais</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="pr">Paraná</option>
                <option value="sc">Santa Catarina</option>
            </select>
            <br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>

        </fieldset>

        <fieldset>
            <legend>Sobre o aluno</legend>

            <label for="sobre">Conte um pouco sobre você:</label><br>
            <textarea id="sobre" name="sobre" placeholder="Fale sobre você e seus interesses em programação" rows="5" minlength="20" required></textarea>

        </fieldset>

        <fieldset>
            <legend>Termos</legend>

            <input type="checkbox" id="termos" name="termos" value="aceito" required>
            <label for="termos">Aceito os termos de inscrição</label>

        </fieldset>

        <button type="submit">Enviar inscrição</button>
        <button type="reset">Limpar</button>

    </form>
</body>

</html>
